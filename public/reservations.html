<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Gestion Réservations</title>
</head>

<body>

  <h1>Gestion des Réservations</h1>

  <a href="/dashboard.html">
    Retour dashboard
  </a>

  <hr>

  <h2>Ajouter une réservation</h2>

  <form id="reservationForm">

    <input
      type="number"
      id="catwayNumber"
      placeholder="Numéro du catway"
      required
    >

    <br><br>

    <input
      type="text"
      id="clientName"
      placeholder="Nom du client"
      required
    >

    <br><br>

    <input
      type="text"
      id="boatName"
      placeholder="Nom du bateau"
      required
    >

    <br><br>

    <label>Date début</label>

    <br>

    <input
      type="date"
      id="startDate"
      required
    >

    <br><br>

    <label>Date fin</label>

    <br>

    <input
      type="date"
      id="endDate"
      required
    >

    <br><br>

    <button type="submit">
      Ajouter
    </button>

  </form>

  <hr>

  <h2>Liste des réservations du catway 1</h2>

  <ul id="reservationList"></ul>

  <script>

    async function loadReservations() {

      const response = await fetch(
        "/catways/1/reservations"
      );

      const reservations =
        await response.json();

      const list =
        document.getElementById("reservationList");

      list.innerHTML = "";

      reservations.forEach((reservation) => {

        list.innerHTML += `
          <li>
            ${reservation.clientName}
            -
            ${reservation.boatName}
            -
            du
            ${new Date(reservation.startDate).toLocaleDateString()}
            au
            ${new Date(reservation.endDate).toLocaleDateString()}
          </li>
        `;
      });
    }

    document
      .getElementById("reservationForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();

        const catwayNumber =
          document.getElementById("catwayNumber").value;

        const clientName =
          document.getElementById("clientName").value;

        const boatName =
          document.getElementById("boatName").value;

        const startDate =
          document.getElementById("startDate").value;

        const endDate =
          document.getElementById("endDate").value;

        await fetch(
          `/catways/${catwayNumber}/reservations`,
          {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              clientName,
              boatName,
              startDate,
              endDate
            })
          }
        );

        loadReservations();
      });

    loadReservations();

  </script>

</body>
</html>
